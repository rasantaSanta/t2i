<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t2i</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --text:#e6e8ec; --dim:#8b92a0; --acc:#6aa6ff; --good:#4cc38a; --bad:#e5604d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; gap:16px; align-items:baseline; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  #stats { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:20px; padding:20px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  form, .job { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  label { display:block; color:var(--dim); font-size:12px; margin:10px 0 4px; }
  textarea, input, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  textarea { resize:vertical; min-height:90px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { background:var(--acc); color:#06101f; border:0; border-radius:6px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:400; }
  button:disabled { opacity:.5; cursor:default; }
  form button[type=submit] { width:100%; margin-top:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { padding:5px 12px; }
  .tabs button.on { background:var(--acc); color:#06101f; border-color:var(--acc); }
  #jobs { display:grid; gap:10px; margin-bottom:14px; }
  .job { display:flex; align-items:center; gap:12px; }
  .bar { flex:1; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); transition:width .3s; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card.good { border-color:var(--good); } .card.bad { border-color:var(--bad); opacity:.6; }
  .card img { width:100%; display:block; cursor:zoom-in; background:#000; }
  .meta { padding:8px 10px; }
  .meta p { margin:0 0 6px; color:var(--dim); font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .acts { display:flex; gap:6px; }
  .acts button { flex:1; padding:5px; background:var(--bg); color:var(--text); border:1px solid var(--line); font-weight:400; }
  .acts button.on.up { background:var(--good); color:#04140c; border-color:var(--good); }
  .acts button.on.down { background:var(--bad); color:#fff; border-color:var(--bad); }
  .acts button.on.fav { background:#f2c14e; color:#201600; border-color:#f2c14e; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; max-width:min(1100px,95vw); padding:0; }
  dialog::backdrop { background:#000c; }
  dialog img { max-width:100%; max-height:75vh; display:block; margin:auto; }
  dialog .info { padding:12px 16px; font-size:12px; color:var(--dim); white-space:pre-wrap; }
  #sugg { margin-top:6px; display:flex; flex-wrap:wrap; gap:5px; font-size:12px; }
  .chip { border:1px solid var(--line); border-radius:12px; padding:2px 9px; cursor:pointer; background:var(--bg); }
  .chip.add { border-color:var(--good); } .chip.avoid { border-color:var(--bad); text-decoration:line-through; cursor:default; }
  #insBody { font-size:12px; color:var(--dim); margin-top:8px; } #insBody b { color:var(--text); }
  #insBody li { margin:2px 0; } #insBody ul { margin:4px 0 8px; padding-left:18px; }
  .score { position:absolute; top:8px; right:8px; background:#000b; color:#fff; border-radius:10px; padding:1px 8px; font-size:12px; }
  .card { position:relative; }
  #scorerBox button { width:100%; margin-top:6px; }
  .empty { color:var(--dim); padding:40px; text-align:center; }
</style>
</head>
<body>
<header><h1>t2i</h1><span id="stats"></span></header>
<main>
  <form id="form">
    <label>Prompt</label>
    <textarea id="prompt" required placeholder="Beschreibe das Bild, möglichst ausführlich…"></textarea>
    <div id="sugg"></div>
    <label>Modell</label>
    <select id="model"></select>
    <label>Negativ-Prompt <span id="negHint"></span></label>
    <input id="negative" placeholder="z. B. blurry, deformed, text, watermark">
    <div class="row">
      <div><label>Anzahl</label><input id="count" type="number" min="1" max="16" value="4"></div>
      <div><label>Seed (leer = zufällig)</label><input id="seed" type="number" placeholder="zufällig"></div>
      <div><label>Breite</label><input id="width" type="number" step="64" min="256" max="2048" value="1024"></div>
      <div><label>Höhe</label><input id="height" type="number" step="64" min="256" max="2048" value="1024"></div>
      <div><label>Schritte</label><input id="steps" type="number" min="1" max="100"></div>
      <div><label>Guidance</label><input id="guidance" type="number" step="0.5" min="0" max="20"></div>
    </div>
    <button type="submit">Generieren</button>
    <details id="ins" style="margin-top:14px"><summary style="cursor:pointer;color:var(--dim)">Was funktioniert bei dir</summary><div id="insBody"></div></details>
  </form>
  <section>
    <div id="jobs"></div>
    <div class="tabs" id="tabs"></div>
    <div id="grid"></div>
  </section>
</main>
<dialog id="dlg"><img id="dlgImg"><div class="info" id="dlgInfo"></div></dialog>

<script>
const $ = id => document.getElementById(id);
let models = {}, filter = 'all', trackedDone = new Set();

const api = async (url, opt) => {
  const r = await fetch(url, opt && { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(opt) });
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
};

function applyDefaults() {
  const m = models[$('model').value]; if (!m) return;
  $('steps').value = m.defaults.steps;
  $('guidance').value = m.defaults.guidance;
  $('negative').disabled = !m.defaults.negative;
  $('negHint').textContent = m.defaults.negative ? '' : '(von FLUX ignoriert)';
}

async function init() {
  models = await api('/api/models');
  const names = Object.keys(models);
  $('model').innerHTML = names.map(n => `<option>${n}</option>`).join('');
  if (!names.length) $('model').innerHTML = '<option value="">Keine Modelle gefunden (T2I_MODELS_DIR)</option>';
  $('model').onchange = applyDefaults; applyDefaults();
  $('tabs').innerHTML = [['all','Alle'],['unrated','Unbewertet'],['top','Beste zuerst'],['good','👍 Gut'],['bad','👎 Schlecht'],['favorite','★ Favoriten']]
    .map(([k,l]) => `<button class="ghost ${k===filter?'on':''}" data-f="${k}">${l}</button>`).join('');
  $('tabs').onclick = e => { const f = e.target.dataset.f; if (!f) return; filter = f;
    [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.f === f)); loadImages(); };
  loadImages(); poll();
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const body = { prompt:$('prompt').value, model:$('model').value, count:+$('count').value,
    steps:+$('steps').value || null, guidance:$('guidance').value === '' ? null : +$('guidance').value,
    width:+$('width').value, height:+$('height').value, negative:$('negative').value,
    seed:$('seed').value === '' ? null : +$('seed').value };
  try { await api('/api/generate', body); poll(); } catch (err) { alert(err.message); }
};

async function poll() {
  const jobs = await api('/api/jobs');
  $('jobs').innerHTML = jobs.map(j => {
    const total = j.count * j.steps, cur = j.done * j.steps + j.step;
    const label = j.status === 'queued' ? 'wartet' : j.status === 'loading' ? 'Modell lädt (beim ersten Mal 1–3 min)…' : `Bild ${Math.min(j.done+1,j.count)}/${j.count}`;
    return `<div class="job"><div style="flex:1"><div>${esc(j.prompt.slice(0,70))}</div><div style="color:var(--dim);font-size:12px">${label}</div>
      <div class="bar"><i style="width:${total ? 100*cur/total : 0}%"></i></div></div>
      <button class="ghost" onclick="api('/api/jobs/${j.id}/cancel',{})">Abbrechen</button></div>`;
  }).join('');
  if (jobs.length) { loadImages(true); setTimeout(poll, 1000); } else loadImages(true);
}

let lastKey = '';
async function loadImages(quiet) {
  const [imgs, st] = await Promise.all([api(`/api/images?filter=${filter}&limit=120`), api('/api/stats')]);
  $('stats').textContent = `${st.total} Bilder · ${st.good} 👍 · ${st.bad} 👎 · ${st.unrated} unbewertet`;
  const key = JSON.stringify(imgs.map(i => [i.id, i.rating, i.favorite, i.score]));
  if (quiet && key === lastKey) return; lastKey = key;
  $('grid').innerHTML = imgs.length ? imgs.map(card).join('') : '<div class="empty">Noch nichts hier.</div>';
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(i) {
  const cls = i.rating === 1 ? 'good' : i.rating === -1 ? 'bad' : '';
  const badge = i.score != null && i.rating === 0 ? `<span class="score" title="Vorhersage des Bewertungsmodells, dass dir das Bild gefällt">${Math.round(100*i.score)}%</span>` : '';
  return `<div class="card ${cls}" id="c${i.id}">${badge}<img loading="lazy" src="/img/${i.file}" onclick="show(${i.id})">
    <div class="meta"><p title="${esc(i.prompt)}">${esc(i.prompt)}</p>
    <div class="acts">
      <button class="up ${i.rating===1?'on':''}" onclick="rate(${i.id},${i.rating===1?0:1})">👍</button>
      <button class="down ${i.rating===-1?'on':''}" onclick="rate(${i.id},${i.rating===-1?0:-1})">👎</button>
      <button class="fav ${i.favorite?'on':''}" onclick="fav(${i.id},${!i.favorite})">★</button>
    </div></div></div>`;
}

async function rate(id, rating) { await api(`/api/images/${id}/rate`, { rating }); loadImages(); }
async function fav(id, favorite) { await api(`/api/images/${id}/rate`, { favorite, rating: favorite ? 1 : undefined }); loadImages(); }

async function show(id) {
  const i = await api(`/api/images/${id}`);
  $('dlgImg').src = `/img/${i.file}`;
  $('dlgInfo').textContent = `${i.prompt}\n\n${i.model} · ${i.width}×${i.height} · ${i.steps} Schritte · guidance ${i.guidance} · seed ${i.seed} · ${i.duration_s}s` +
    (i.negative ? `\nnegativ: ${i.negative}` : '');
  $('dlg').showModal();
}
$('dlg').onclick = e => { if (e.target === $('dlg') || e.target === $('dlgImg')) $('dlg').close(); };

// Prompt-Vorschläge aus den Bewertungen (zeitverzögert beim Tippen)
let suggTimer;
$('prompt').oninput = () => { clearTimeout(suggTimer); suggTimer = setTimeout(async () => {
  const p = $('prompt').value.trim(); if (p.length < 8) { $('sugg').innerHTML = ''; return; }
  const s = await api('/api/suggest?prompt=' + encodeURIComponent(p));
  $('sugg').innerHTML =
    s.add.map(x => `<span class="chip add" title="${x.good}👍 ${x.bad}👎 bei ${x.n} Bildern" data-add="${esc(x.phrase)}">+ ${esc(x.phrase)}</span>`).join('') +
    s.avoid.map(x => `<span class="chip avoid" title="${x.good}👍 ${x.bad}👎 bei ${x.n} Bildern">${esc(x.phrase)}</span>`).join('');
}, 500); };
$('sugg').onclick = e => { const a = e.target.dataset.add; if (!a) return;
  $('prompt').value = $('prompt').value.replace(/[\s,.]*$/, '') + ', ' + a; e.target.remove(); };

async function loadInsights() {
  const d = await api('/api/insights');
  const li = a => a.length ? `<ul>${a.map(x => `<li><b>${esc(x.phrase)}</b> — ${x.good}👍 ${x.bad}👎 (${x.n})</li>`).join('')}</ul>` : '<ul><li>noch nichts Eindeutiges</li></ul>';
  $('insBody').innerHTML = (d.ready ? '' : `<p>Erst ${d.rated} Bewertungen – ab ca. 20 werden die Muster belastbar.</p>`) +
    `<b>Hilft</b>${li(d.helpful)}<b>Schadet</b>${li(d.harmful)}<b>Modelle</b><ul>` +
    (d.models.map(m => `<li>${esc(m.model)}: ${Math.round(100*m.good_rate)}% gut (${m.rated} bewertet), Ø ${m.avg_seconds}s</li>`).join('') || '<li>noch keine Daten</li>') + '</ul>' +
    '<div id="scorerBox"></div>';
  loadScorer();
}

async function loadScorer() {
  const s = await api('/api/scorer');
  let t = `<b>Bewertungsmodell</b><br>${s.good} 👍 / ${s.bad} 👎 bewertet. `;
  if (!s.can_train) t += `Training ab ${s.min_rated} Bewertungen, davon mindestens ${s.min_per_class} 👍 und ${s.min_per_class} 👎.`;
  else if (s.trained) t += s.active
    ? `Aktiv: trifft in ${Math.round(100*s.cv_accuracy)}% der Fälle (Zufall: 50%, p=${s.p_value}). Unbewertete Bilder zeigen einen Score, „Beste zuerst“ sortiert danach.`
    : `Nicht aktiv: Treffer ${Math.round(100*s.cv_accuracy)}%, p=${s.p_value} – noch nicht klar besser als Zufall. Mehr bewerten, dann erneut trainieren.`;
  else t += 'Bereit zum Training.';
  $('scorerBox').innerHTML = t + (s.can_train ? '<button type="button" class="ghost" id="trainBtn">Bewertungsmodell trainieren</button>' : '');
  if ($('trainBtn')) $('trainBtn').onclick = async () => {
    $('trainBtn').disabled = true; $('trainBtn').textContent = 'Trainiert… (beim ersten Mal lädt CLIP ~600 MB)';
    try { await api('/api/scorer/train', {}); } catch (e) { alert(e.message); }
    loadScorer(); loadImages();
  };
}
$('ins').ontoggle = () => { if ($('ins').open) loadInsights(); };

init();
</script>
</body>
</html>
